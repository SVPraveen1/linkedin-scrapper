<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Maps Scraper</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Snapshot ID Display Styling */
    .snapshot-info {
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }

    .snapshot-info label {
      display: block;
      font-weight: 600;
      color: #0c4a6e;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .snapshot-id-display {
      background: white;
      padding: 16px;
      border-radius: 6px;
      border: 1px solid #93c5fd;
      text-align: center;
    }

    .snapshot-id-display code {
      font-family: 'Courier New', monospace;
      font-size: 16px;
      color: #1e40af;
      font-weight: 600;
      letter-spacing: 0.5px;
      user-select: all;
      cursor: text;
      display: block;
      padding: 8px;
    }

    .next-steps {
      margin-top: 24px;
      padding: 20px;
      background: linear-gradient(135deg, #fefce8 0%, #fef9c3 100%);
      border: 1px solid #fde047;
      border-radius: 8px;
    }

    .next-steps h4 {
      color: #854d0e;
      font-size: 16px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .next-steps ol {
      margin: 0;
      padding-left: 20px;
      color: #713f12;
    }

    .next-steps li {
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .next-steps a {
      color: #0176d3;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid #0176d3;
    }

    .next-steps a:hover {
      color: #014486;
      border-bottom-color: #014486;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🗺️ Google Maps Scraper</h1>
      <p>Scrape Google Maps place information</p>
      <a href="index.html" class="back-btn">← Back to Dashboard</a>
    </header>

    <div class="content">
      <div class="api-section">
        <h2>Scrape Maps Places by URL</h2>
        <p class="description">Enter Google Maps place URLs to scrape details</p>

        <form id="mapsForm">
          <div class="form-group">
            <label for="maps_urls">Google Maps URLs (one per line) *</label>
            <textarea
              id="maps_urls"
              rows="6"
              placeholder="https://www.google.com/maps/place/..."
              required
            ></textarea>
          </div>
          <button type="submit" class="btn-primary">Scrape Places</button>
        </form>

        <div id="mapsResult" class="result-box"></div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('mapsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const resultDiv = document.getElementById('mapsResult');
      resultDiv.innerHTML = '<div class="loading">Loading...</div>';

      const urls = document.getElementById('maps_urls').value
        .split('\n')
        .map(u => u.trim())
        .filter(u => u);

      try {
        const response = await fetch('/maps-scraper/collect-by-url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ urls })
        });

        const data = await response.json();
        resultDiv.innerHTML = `
          <div class="success">
            <h3>✓ Request Successful</h3>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          </div>
        `;
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="error">
            <h3>✗ Error</h3>
            <p>${error.message}</p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
