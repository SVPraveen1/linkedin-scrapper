<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Scraper</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Snapshot ID Display Styling */
      .snapshot-info {
        background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        border: 1px solid #bae6fd;
        border-radius: 8px;
        padding: 20px;
        margin: 20px 0;
      }

      .snapshot-info label {
        display: block;
        font-weight: 600;
        color: #0c4a6e;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .snapshot-id-display {
        background: white;
        padding: 16px;
        border-radius: 6px;
        border: 1px solid #93c5fd;
        text-align: center;
      }

      .snapshot-id-display code {
        font-family: 'Courier New', monospace;
        font-size: 16px;
        color: #1e40af;
        font-weight: 600;
        letter-spacing: 0.5px;
        user-select: all;
        cursor: text;
        display: block;
        padding: 8px;
      }

      .next-steps {
        margin-top: 24px;
        padding: 20px;
        background: linear-gradient(135deg, #fefce8 0%, #fef9c3 100%);
        border: 1px solid #fde047;
        border-radius: 8px;
      }

      .next-steps h4 {
        color: #854d0e;
        font-size: 16px;
        margin-bottom: 12px;
        font-weight: 700;
      }

      .next-steps ol {
        margin: 0;
        padding-left: 20px;
        color: #713f12;
      }

      .next-steps li {
        margin-bottom: 8px;
        line-height: 1.6;
      }

      .next-steps a {
        color: #0176d3;
        font-weight: 600;
        text-decoration: none;
        border-bottom: 1px solid #0176d3;
      }

      .next-steps a:hover {
        color: #014486;
        border-bottom-color: #014486;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>📸 Instagram Scraper</h1>
        <p>Scrape Instagram profiles, posts, and reels</p>
        <a href="index.html" class="back-btn">← Back to Dashboard</a>
      </header>

      <div class="content">
        <!-- Profile by URL -->
        <div class="api-section">
          <h2>Scrape Instagram Profiles by URL</h2>
          <form id="igProfileForm">
            <div class="form-group">
              <label>Profile URLs (one per line) *</label>
              <textarea
                id="ig_profile_urls"
                rows="4"
                placeholder="https://www.instagram.com/username/"
                required
              ></textarea>
            </div>
            <button type="submit" class="btn-primary">Scrape Profiles</button>
          </form>
          <div id="igProfileResult" class="result-box"></div>
        </div>

        <!-- Posts by URL -->
        <div class="api-section">
          <h2>Scrape Instagram Posts by URL</h2>
          <form id="igPostForm">
            <div class="form-group">
              <label>Post URLs (one per line) *</label>
              <textarea id="ig_post_urls" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn-primary">Scrape Posts</button>
          </form>
          <div id="igPostResult" class="result-box"></div>
        </div>

        <!-- Reels by URL -->
        <div class="api-section">
          <h2>Scrape Instagram Reels by URL</h2>
          <form id="igReelForm">
            <div class="form-group">
              <label>Reel URLs (one per line) *</label>
              <textarea id="ig_reel_urls" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn-primary">Scrape Reels</button>
          </form>
          <div id="igReelResult" class="result-box"></div>
        </div>
        <!-- Profile by username -->
        <section class="api-section">
          <h2>Discover Instagram Profiles by Username</h2>
          <form id="igDiscoverUsernameForm">
            <textarea
              id="ig_usernames"
              rows="3"
              placeholder="Username, one per line"
              required
            ></textarea>
            <button type="submit">Discover Profiles</button>
          </form>
          <div id="igDiscoverUsernameResult"></div>
        </section>
      </div>
    </div>

    <script>
      // Profile scraper
      document
        .getElementById("igProfileForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const resultDiv = document.getElementById("igProfileResult");
          resultDiv.innerHTML = '<div class="loading">Loading...</div>';
          const urls = document
            .getElementById("ig_profile_urls")
            .value.split("\n")
            .map((u) => u.trim())
            .filter((u) => u);
          try {
            const response = await fetch("/instagram-profile/collect-by-url", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ urls }),
            });
            const data = await response.json();
            resultDiv.innerHTML = `
              <div class="success">
                <h3>✓ Request Successful</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
              </div>
            `;
          } catch (error) {
            resultDiv.innerHTML = `
              <div class="error">
                <h3>✗ Error</h3>
                <p>${error.message}</p>
              </div>
            `;
          }
        });

      // Post scraper
      document
        .getElementById("igPostForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const resultDiv = document.getElementById("igPostResult");
          resultDiv.innerHTML = '<div class="loading">Loading...</div>';
          const urls = document
            .getElementById("ig_post_urls")
            .value.split("\n")
            .map((u) => u.trim())
            .filter((u) => u);
          try {
            const response = await fetch("/instagram-post/collect-by-url", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ urls }),
            });
            const data = await response.json();
            resultDiv.innerHTML = `
              <div class="success">
                <h3>✓ Request Successful</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
              </div>
            `;
          } catch (error) {
            resultDiv.innerHTML = `
              <div class="error">
                <h3>✗ Error</h3>
                <p>${error.message}</p>
              </div>
            `;
          }
        });

      // Reel scraper
      document
        .getElementById("igReelForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const resultDiv = document.getElementById("igReelResult");
          resultDiv.innerHTML = '<div class="loading">Loading...</div>';
          const urls = document
            .getElementById("ig_reel_urls")
            .value.split("\n")
            .map((u) => u.trim())
            .filter((u) => u);
          try {
            const response = await fetch("/instagram-reels/collect-by-url", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ urls }),
            });
            const data = await response.json();
            resultDiv.innerHTML = `
              <div class="success">
                <h3>✓ Request Successful</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
              </div>
            `;
          } catch (error) {
            resultDiv.innerHTML = `
              <div class="error">
                <h3>✗ Error</h3>
                <p>${error.message}</p>
              </div>
            `;
          }
        });

      // Discover profiles by username
      document
        .getElementById("igDiscoverUsernameForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const resultDiv = document.getElementById("igDiscoverUsernameResult");
          resultDiv.innerHTML = '<div class="loading">Loading...</div>';
          
          const usernames = document
            .getElementById("ig_usernames")
            .value.split("\n")
            .map((u) => u.trim())
            .filter(Boolean);
          const user_names = usernames;
          
          try {
            const res = await fetch("/instagram-profile/discover-by-username", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ user_names }),
            });
            const data = await res.json();
            resultDiv.innerHTML = `
              <div class="success">
                <h3>✓ Request Successful</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
              </div>
            `;
          } catch (error) {
            resultDiv.innerHTML = `
              <div class="error">
                <h3>✗ Error</h3>
                <p>${error.message}</p>
              </div>
            `;
          }
        });
    </script>
  </body>
</html>
